[source.vendored-sources]
directory = "vendor"

[build]
# Incremental compilation is the biggest win for iterative dev (default on, but explicit).
incremental = true
# Use all cores; cargo defaults to nproc already, this documents intent.
# jobs = 16

# Faster linker on Linux (opt-in): lld is 3-5x faster than GNU ld for the gpui link step.
# Requires clang + lld. Do NOT enable by default — hosts without clang/lld will fail to link,
# and CI uses mold (see .github/workflows/cd.yml) which this would override.
# To enable locally, uncomment the block for your arch and set RUSTFLAGS instead if you
# prefer not to touch config, e.g.:
#   RUSTFLAGS="-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--compress-debug-sections=zstd" \
#     cargo build
# or export CARGO_BUILD_RUSTFLAGS. Keep Windows/macOS unaffected.
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,--compress-debug-sections=zstd"]
#
# [target.aarch64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# sccache (if installed) caches rustc + C/C++ (cc) results across clean builds.
# Install: `paru -S sccache` or `cargo install sccache`, then `export RUSTC_WRAPPER=sccache`
# and `export CMAKE_C_COMPILER_LAUNCHER=sccache` for rusqlite/cc crates.
# Uncomment to enable automatically when sccache is in PATH:
# [env]
# RUSTC_WRAPPER = "sccache"
