name: Bug report
description: Report a problem with the launcher
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Fill in all fields that apply.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. The launcher redacts tokens automatically. Do not paste raw secrets.
      placeholder: Paste logs here or say "no logs".
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Version from the launcher title bar or tag (for example v1.2.3).
      placeholder: v1.2.3
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version / distro
      placeholder: Ubuntu 24.04, Windows 11, macOS 15
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets from logs before pasting.
          required: true
