name: Feature request
description: Suggest an idea for the launcher
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Is it related to a current limitation?
      placeholder: I want to ... but currently ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the solution you want.
      placeholder: Add / change ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative solutions or workarounds you considered?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Screenshots, links, or examples.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
