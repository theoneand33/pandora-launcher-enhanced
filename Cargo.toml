[workspace]
resolver = "3"
members = ["crates/backend", "crates/bridge", "crates/reqwest_client", "crates/frontend", "crates/pandora_launcher", "crates/nbt", "crates/schema", "crates/auth", "crates/command", "crates/t", "crates/ftree"]

default-members = ["crates/pandora_launcher"]

[workspace.package]
edition = "2024"
version = "5.3.1"

# Fast dev builds: no LTO, many codegen units, incremental, no heavy opt.
# Release keeps thin LTO but uses more codegen units in dependencies where profitable.
[profile.dev]
opt-level = 0
debug = 1
# 64 is safe for 4c/8 GiB. On 16c 32 GiB use 256 for max parallelism (~17m user -> ~2m wall, but 2-3x RAM).
# Override without editing: cargo build --config profile.dev.codegen-units=256
codegen-units = 64
incremental = true
lto = false
# unpacked = faster link on Linux/macOS (Windows ignores)
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Previously opt-level = 3 forced every dep to optimize fully in dev mode,
# which roughly doubles clean build time. Keep debug deps unoptimized.
# If you need optimized deps locally, run `cargo build --profile dev-opt`.
opt-level = 0

[profile.dev-opt]
inherits = "dev"
opt-level = 2
incremental = true

[profile.release]
debug = "limited"
lto = "thin"
# 16 codegen units in main crate for faster link; deps use 1 for ~1-2% runtime gain (not zero-cost)
codegen-units = 16
incremental = false
# Enable for more accurate flamegraphs
# debug = true

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

[patch.crates-io]
zbus-lockstep = { path = "patches/zbus-lockstep" }
zbus-lockstep-macros = { path = "patches/zbus-lockstep-macros" }

[workspace.dependencies]
auth = { path = "crates/auth" }
backend = { path = "crates/backend" }
bridge = { path = "crates/bridge" }
command = { path = "crates/command" }
frontend = { path = "crates/frontend" }
schema = { path = "crates/schema" }
t = { path = "crates/t" }
nbt = { path = "crates/nbt" }
reqwest_client = { path = "crates/reqwest_client" }

anyhow = "1.0.100"
atomic-time = "0.1.5"
atomic_enum = "0.3.0"
backtrace = "0.3.76"
byteorder = "1.5.0"
bytes = "1.10.1"
cesu8 = "1.1.0"
chrono = { version = "0.4.42", features = ["serde"] }
directories = "6.0.0"
flate2 = "1.1.5"
ftree = { path = "crates/ftree"}
futures = "0.3.31"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "bbf7650abae59e3a984d48bd120a6f9094fed1f2" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "bbf7650abae59e3a984d48bd120a6f9094fed1f2" }
hex = { version = "0.4.3", features = ["serde"] }
# Only png/jpeg are hot paths (all skin/icon loads are ImageFormat::Png). Default pulls
# avif/rav1e (C+rust, ~90 crates), exr, tiff. Keep png+jpeg+bmp+gif+webp (cheap) and
# drop heavy avif/exr/tiff/qoi/dds/hdr. Saves ~30-40% image compile time.
# Breaking: avif/tiff/qoi icons will now error on load (guess_format succeeds but
# load fails with Unsupported). Previously any format was re-encoded to PNG for
# mod icons (modrinth.rs, mod_metadata.rs). Add "avif" etc. to features if needed.
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
indexmap = { version = "2.12.0", features = ["serde"] }
lexical-sort = "0.3.1"
lru = "0.16.2"
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
num = "0.4.3"
once_cell = "1.21.3"
os_info = "3.12.0"
paste = "1.0.15"
rand = "0.8.5"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "stream", "multipart"] }
rust-embed = "8.7.2"
rustc-hash = "2.1.1"
sanitize-filename = "0.6.0"
serde = { version = "1.0.228", features = ["rc", "alloc", "derive"] }
serde-untagged = "0.1.9"
serde_json = "1.0.145"
sha1 = "0.10.6"
slab = "0.4.11"
thiserror = "2.0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ustr = { version = "1.1.0", features = ["serde"] }
base64 = "0.22.1"
oauth2 = { version = "5.0.0", features = ["reqwest"] }
sha2 = "0.10.9"
zip = "8.5.1"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde"] }
heapless = "0.9.1"
intrusive-collections = "0.9.7"
tokio-util = "0.7.17"
enumset = { version = "1.1.10", features = [ "serde" ] }
serde_with = "3.15.1"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
lzma-rs = "0.3.0"
httparse = "1.10.1"
enum-map = "2.7.3"
strum = { version = "0.27.2", features = ["derive"] }
rayon = "1.11.0"
rc-zip-sync = "4.4.2"
relative-path = { version = "2.0.1", features = ["serde"] }
shell-words = "1.1.1"
serde-xml-rs = "0.8.2"
memchr = "2.7.6"
toml = "0.9.11"
clap = { version = "4.5.54", features = ["derive"] }
open = "5.2.0"
sys-locale = "0.3.2"
native-dialog = "0.9.4"
fern = { version = "0.7.1", features = ["colored"] }
mslnk = "0.1.8"
log = "0.4.29"
humantime = "2.3.0"
minisign-verify = "0.2.4"
tar = "0.4.44"
runas = "1.2.0"
# System sqlite on Linux/macOS for faster builds (requires libsqlite3-dev / pkg-config).
# Windows uses bundled (see crates/backend/Cargo.toml). Install libsqlite3-dev locally
# or set rusqlite features = ["bundled"] if system sqlite is missing.
rusqlite = { version = "0.38.0", features = [] }
walkdir = "2.5.0"
urlencoding = "2.1.3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Console", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops", "Wdk_System_SystemServices", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Credentials", "Win32_Security_Authorization"] }
itertools = "0.14.0"
crc32fast = "1.5.0"
scopeguard = "1.2.0"
hickory-resolver = { version = "0.25.2", features = ["system-config"] }
libseccomp = "0.4.0"
libc = "0.2.183"
security-framework = "3.5.1"
security-framework-sys = "2.15.0"
junction = "1.3.0"
